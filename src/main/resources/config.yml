  prefix: "&8[&6&lŞansÇarkı&8] &r"
  no-permission: "&cBu işlemi yapmak için yetkiniz yok!"
  wheel-busy: "&cBu Şans Çarkı şu anda &e%spinner% &ctarafından çevriliyor! Lütfen bitmesini bekle."
  no-ticket: "&cŞans Çarkını çevirmek için &eŞans Çarkı Biletine &cihtiyacın var!"
  no-ticket-in-hand: "&cŞans Çarkını çevirmek için &eŞans Çarkı Biletini &celinde tutmalısın!"
  spin-started: "&aŞans Çarkı dönmeye başladı! Bol şans..."
  ticket-given: "&a%player% &7adlı oyuncuya &e%amount%x Şans Çarkı Bileti &7verildi!"
  ticket-received: "&aSana &e%amount%x Şans Çarkı Bileti &averildi!"
  wheel-placed: "&aŞans Çarkı (&e#%id%&a) başarıyla yerleştirildi! Mod: &e%mode%"
  wheel-removed: "&cŞans Çarkı (&e#%id%&c) kaldırıldı."
  mode-changed: "&aGörünüm modu &e%mode% &aolarak değiştirildi ve tüm çarklar güncellendi!"
  scale-changed: "&aÇark boyutu &e%scale% &aolarak değiştirildi ve tüm çarklar güncellendi!"
  reloaded: "&aTkitsuneFortune yapılandırması ve tüm 3D çarklar başarıyla yeniden yüklendi!"

