# ============================================================================
#                      TkitsuneFortune - 3D Şans Çarkı
#                   Spigot & Paper 1.21.11 Destekli Eklenti
# ============================================================================

settings:
  # Dil Seçimi / Language Selection: "TR" (Türkçe) veya "EN" (English)
  # Oyun içinden "/tkf lang <tr|en>" komutuyla veya "/tkf" menüsünden tek tıkla değiştirebilirsiniz!
  language: "TR"

  # Görünüm Modu:
  # - RESOURCE_PACK : Eklenti klasöründe otomatik oluşturulan TkitsuneFortune-ResourcePack.zip
  #                   dosyasındaki 128x128 HD dokulu özel 3D modeli (ItemDisplay) kullanır.
  # - BLOCK_DISPLAY : Sunucuya Resource Pack yüklemeden, Blockbench modelindeki parçaları
  #                   birebir BlockDisplay olarak oluşturur ve döndürür.
  # Oyun içinden "/tkf mode <BLOCK_DISPLAY|RESOURCE_PACK>" komutuyla anlık değiştirebilirsiniz!
  render-mode: "RESOURCE_PACK"

  # 3D Çarkın boyut çarpanı (Varsayılan: 1.7)
  scale: 1.7

  # Çarkın üzerindeki 8 dilimde 3D ödül ikonları ve ödül isimleri gözüksün mü?
  show-slice-prizes: true

  # Çarkın dönme süresi (20 tick = 1 saniye, 120 tick = 6 saniye)
  spin-duration-ticks: 120

  # Çark dönerken en az ve en fazla kaç tam tur atsın?
  min-full-rotations: 3
  max-full-rotations: 5

  # Biletin oyuncunun elinde tutulması zorunlu olsun mu?
  # true  -> Oyuncu özel tasarımlı bileti elinde tutarak çarka sağ tıklamalıdır.
  # false -> Oyuncunun envanterinde bilet olması yeterlidir, sağ tıklayınca 1 adet harcanır.
  require-ticket-in-hand: true

  # Otomatik Resource Pack Sunucusu (Oyuncular sunucuya girince özel bilet ve çark dokusunu otomatik yükler!)
  resource-pack:
    auto-host: true
    auto-send: true
    force: false
    port: 8765
    public-host: "auto"

  # Çarkın üstündeki 3D TextDisplay (Hologram) ayarları
  # Oyun içinden "/tkf hologram" veya "/tkf" -> Hologram Tasarımı menüsünden anlık düzenleyebilirsiniz!
  hologram:
    enabled: true
    title: "&6&l✦ &e&lTkitsune Şans Çarkı &6&l✦"
    height-offset: 2.25
    scale: 1.0
    background: "TRANSPARENT" # TRANSPARENT, DARK, CRIMSON, GOLD, PURPLE, AQUA
    billboard: "CENTER"       # CENTER, VERTICAL, FIXED
    shadowed: true
    idle-lines:
      - "%title%"
      - "&7Elindeki &e&lÖzel Şans Çarkı Bileti &7ile &aSağ Tıkla!"
    spinning-lines:
      - "%title%"
      - "&7Çeviren: &b%player%"
      - "&e▸ &f%slice% &e◂"

# Özel Tasarımlı 3D Çark Bileti (Token) Eşyası Ayarları
ticket:
  material: "PAPER"
  custom-model-data: 1004
  item-model: "tkitsunefortune:ticket"
  glow: false
  name: "&6&l✦ &e&lTkitsune Şans Çarkı Bileti &6&l✦"
  lore:
    - "&8Özel Tasarım VIP Çark Bileti"
    - ""
    - "&7Bu özel işlemeli altın bileti elinde tutarak"
    - "&6Tkitsune Şans Çarkına &7sağ tıkla ve çevir!"
    - ""
    - "&e▸ &aElinde tutarak Şans Çarkına sağ tıkla!"

# Mesajlar
